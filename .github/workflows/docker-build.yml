name: Docker build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Define tag
        id: define_tag
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "TAG=latest" >> $GITHUB_ENV
          else
            # Replace slashes with dashes for branch
            # names to create a valid Docker tag
            echo "TAG=${GITHUB_REF_NAME/\//-}" >> $GITHUB_ENV
          fi
      - name: Build and push mysql target
        uses: docker/build-push-action@v6
        with:
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/bastantoine/backup-me:mysql-${{ env.TAG }}
          target: mysql-runtime
      - name: Build and push postgresql target
        uses: docker/build-push-action@v6
        with:
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/bastantoine/backup-me:postgresql-${{ env.TAG }}
          target: postgresql-runtime
      - name: Build and push default target
        uses: docker/build-push-action@v6
        with:
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/bastantoine/backup-me:${{ env.TAG }}
          target: default-runtime
