name: Docker build

on:
  pull_request:
  release:
    types: [published]

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Define tag
        run: |
          # Either branch name or tag name,
          # replacing '/' by '-' to avoid issues with docker tags
          echo "TAG=${GITHUB_REF_NAME/\//-}" >> $GITHUB_ENV

          MYSQL_IMAGE=ghcr.io/bastantoine/backup-me:mysql-${TAG}
          POSTGRESQL_IMAGE=ghcr.io/bastantoine/backup-me:postgresql-${TAG}
          DEFAULT_IMAGE=ghcr.io/bastantoine/backup-me:${TAG}

          # If this is a release, we want to tag the images as 'latest' as well
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "TAG=latest" >> $GITHUB_ENV
          fi

          echo "MYSQL_IMAGE=$MYSQL_IMAGE" >> $GITHUB_ENV
          echo "POSTGRESQL_IMAGE=$POSTGRESQL_IMAGE" >> $GITHUB_ENV
          echo "DEFAULT_IMAGE=$DEFAULT_IMAGE" >> $GITHUB_ENV

      - name: Build and push mysql target
        uses: docker/build-push-action@v6
        with:
          tags: ${{ env.MYSQL_IMAGE }}
          target: mysql-runtime
      - name: Build and push postgresql target
        uses: docker/build-push-action@v6
        with:
          tags: ${{ env.POSTGRESQL_IMAGE }}
          target: postgresql-runtime
      - name: Build and push default target
        uses: docker/build-push-action@v6
        with:
          tags: ${{ env.DEFAULT_IMAGE }}
          target: default-runtime
